name: ShelfBridge validation and source health
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
permissions:
  contents: read
concurrency:
  group: shelfbridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Check preset and catalog contracts
        run: node --test *.test.mjs
      - name: Check each public-domain search provider
        if: github.event_name != 'pull_request'
        run: node health.mjs
