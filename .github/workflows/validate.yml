name: ShelfBridge validation and source health
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
permissions:
  contents: read
concurrency:
  group: shelfbridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check preset and catalog contracts
        run: node --test *.test.mjs
      - name: Check each public-domain search provider
        if: github.event_name != 'pull_request'
        run: node health.mjs
